[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crane-reasoning"
version = "0.1.0"
description = "Iterative reasoning and grammar-augmented generation framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "antlr4-python3-runtime==4.11.1",
    "datasets",
    "fire",
    "func_timeout",
    "interegular",
    "jsonschema",
    "lark",
    "mpmath",
    "mxeval @ git+https://github.com/shubhamugare/mxeval.git",
    "nltk",
    "numpy",
    "Pebble",
    "ply",
    "pyyaml",
    "ray",
    "regex==2023.8.8",
    "srsly",
    "sympy>=1.4",
    "timeout-decorator",
    "torch",
    "tqdm",
    "transformers>=4.42",
    "word2number",
    "z3-solver",
]

[project.scripts]
crane-eval = "crane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["crane.cache*", "crane.iter_cache*", "crane.logging*", "crane.logging2*"]

[tool.setuptools.package-data]
crane = [
    "**/*.lark",
    "**/*.g4",
    "**/*.jar",
    "**/*.yaml",
    "**/*.json",
    "**/*.txt",
    "**/*.sh",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "cache/**", "iter_cache/**", "logging/**", "logging2/**"]
